<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSO TASIKMALAYA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e8f5f0}
iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:white}
</style>
</head>
<body>
<iframe id="app" allow="geolocation; camera"></iframe>
<script>
const GAS_BASE = "https://script.google.com/macros/s/AKfycbzX40LvvnzADqY_yGuTdgiI1ndtu83ZMBMYzwW_MSplZ3m2ML341lFYuj7MFegGbEgC/exec";
const app = document.getElementById("app");
const q = new URLSearchParams(window.location.search);
const page = q.get("page") || "beranda";
const u = new URL(GAS_BASE);
u.searchParams.set("page", page);
q.forEach((v,k) => { if (k !== "page") u.searchParams.set(k,v); });
app.src = u.href;
</script>
</body>
</html>
